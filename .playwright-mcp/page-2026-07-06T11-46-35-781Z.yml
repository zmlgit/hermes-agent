              - generic [ref=f2e243]: 在某个遥远的国度，靠近大海的地方，有个傍海村庄。当地有个军营，军营附近的山头有个炮台。每天正午，在完全相同的时间，大炮会轰鸣一声，村民便知道下午开始了。几个世纪以来，一直如此。
          - listitem [ref=f2e244]:
