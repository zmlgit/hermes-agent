              - generic [ref=f2e227]: 11月13日下午，县长崔建发、县委副书记常歧、副县长张云龙带领林业、交通、农开办等有关部门及各乡镇主要负责同志对今年秋冬季造林绿化工作进行观摩拉练。崔建发一行先后深入到径六路中段
