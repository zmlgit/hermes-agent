                - /url: /id6471686.html
              - generic [ref=f2e235]: 11月26日上午，县委常委、常务副县长郭广州、副县长赵飞深入各乡镇实地督导检查第三次经济普查工作。目前，第三次经济普查工作核查阶段已基本完成，整体工作开展顺利。郭广州、赵飞详细了解和查看了各乡镇经济普查工作的开展情况
          - listitem [ref=f2e236]:
