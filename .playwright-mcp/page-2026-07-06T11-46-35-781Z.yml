              - generic [ref=f2e251]: 计量是探索世界的钥匙，是科技创新的“种子”和“引擎”。历史上三次技术革命都和计量测试技术突破息息相关。 改革开放40年，风云激荡、波澜壮阔，也见证了中国计量从融入世界到赶超先进的不平凡的征程。
          - listitem [ref=f2e252]:
